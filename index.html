<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>MathSnap – Free Advanced Math Solver</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a0f;
      color: #f0eeff;
      font-family: 'Inter', system-ui, sans-serif;
      padding: 1.2rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 1.8rem;
    }
    .header h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #c084fc, #7c6af7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .api-mini {
      background: #13131a;
      border-radius: 28px;
      padding: 0.9rem 1.2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 1.8rem;
      border: 1px solid #2a2a3a;
    }
    .api-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .api-left label {
      font-size: 0.75rem;
      background: #1c1c26;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      color: #a78bfa;
    }
    .api-left input {
      background: #1c1c26;
      border: 1px solid #2a2a3a;
      border-radius: 40px;
      padding: 0.5rem 1rem;
      width: 260px;
      color: white;
      font-family: monospace;
      outline: none;
    }
    .api-left input:focus {
      border-color: #7c6af7;
    }
    button {
      background: #2a2a3a;
      border: none;
      border-radius: 40px;
      padding: 0.5rem 1.2rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
      transition: 0.1s;
    }
    button.primary {
      background: #7c6af7;
    }
    button.primary:hover {
      background: #5f4ad9;
    }
    button.outline {
      background: transparent;
      border: 1px solid #4a4a5a;
    }
    .text-card {
      background: #13131a;
      border-radius: 32px;
      padding: 1.5rem;
      margin: 1rem 0;
      border: 1px solid #2a2a3a;
    }
    textarea {
      width: 100%;
      background: #1c1c26;
      border: 1px solid #2a2a3a;
      border-radius: 24px;
      padding: 1rem;
      color: white;
      font-size: 1rem;
      font-family: 'SF Mono', monospace;
      resize: vertical;
    }
    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 1rem 0;
    }
    .chip {
      background: #1c1c26;
      border: 1px solid #2a2a3a;
      border-radius: 60px;
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .chip:hover {
      background: #2a2a3a;
      border-color: #7c6af7;
    }
    .loader {
      display: none;
      text-align: center;
      margin: 1.5rem 0;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid #2a2a3a;
      border-top-color: #7c6af7;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result-card {
      background: #13131a;
      border-radius: 28px;
      padding: 1.4rem;
      margin-top: 1.5rem;
      border: 1px solid #2a2a3a;
      display: none;
    }
    .answer-highlight {
      background: #0f0f1a;
      border-left: 4px solid #f0c040;
      padding: 1rem;
      border-radius: 20px;
      margin: 0.8rem 0;
    }
    .final-answer {
      font-size: 1.5rem;
      font-weight: bold;
      color: #f0c040;
      word-break: break-word;
    }
    .step {
      margin-bottom: 0.8rem;
      padding-left: 0.5rem;
      border-left: 2px solid #7c6af7;
    }
    .copy-btn {
      margin-top: 1.2rem;
      width: 100%;
      background: #2a2a3a;
    }
    .error-box {
      background: #f8717110;
      border: 1px solid #f8717130;
      border-radius: 20px;
      padding: 0.8rem;
      color: #f87171;
      display: none;
      margin: 0.8rem 0;
    }
    footer {
      text-align: center;
      color: #5a5a7a;
      margin-top: 2rem;
      font-size: 0.7rem;
    }
    @media (max-width: 640px) {
      .api-mini { flex-direction: column; align-items: stretch; }
      .api-left { flex-direction: column; align-items: stretch; }
      .api-left input { width: 100%; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🧮 MathSnap</h1>
    <p>Step-by-step solutions · Type any problem · 100% free</p>
  </div>

  <!-- API Key section (compact) -->
  <div class="api-mini">
    <div class="api-left">
      <label>🔑 Groq API Key</label>
      <input type="password" id="apiKeyInput" placeholder="gsk_...">
      <span id="keyStatus" style="font-size:0.7rem;"></span>
    </div>
    <div>
      <button id="saveKeyBtn" class="primary">Save</button>
      <button id="clearKeyBtn" class="outline">Clear</button>
    </div>
  </div>

  <!-- Text input area (main) -->
  <div class="text-card">
    <textarea id="mathProblem" rows="3" placeholder="Type any math problem...&#10;Example: 8 ÷ 2(2+2)   |   ∫₀¹ x² dx   |   derivative of e^{2x}   |   solve 3x²+5x-2=0"></textarea>
    <div style="display: flex; justify-content: flex-end; margin-top: 1rem;">
      <button id="solveBtn" class="primary">✦ Solve Step-by-Step</button>
    </div>
  </div>

  <!-- Example chips (rich examples) -->
  <div class="chip-grid" id="exampleList"></div>

  <!-- Loader & error -->
  <div class="loader" id="loader"><div class="spinner"></div><div>Solving with AI ...</div></div>
  <div class="error-box" id="errorBox"></div>

  <!-- Result card -->
  <div class="result-card" id="resultCard">
    <div style="font-weight: 600; margin-bottom: 0.8rem;">📘 Full Solution</div>
    <div id="solutionSteps"></div>
    <div class="answer-highlight" id="answerBlock" style="display: none;">
      <div style="font-size: 0.8rem; color: #aaa;">✔ FINAL ANSWER</div>
      <div class="final-answer" id="finalAnswerSpan"></div>
    </div>
    <button id="copySolutionBtn" class="copy-btn outline">📋 Copy Full Solution</button>
  </div>

  <footer>⚡ Powered by Groq Llama 3 (text model) · No credit card · API key stored locally</footer>
</div>

<script>
  // ------------------- CONFIG -------------------
  const STORAGE_KEY = 'mathsnap_groq_key';
  let apiKey = '';
  let isSolving = false;

  const TEXT_MODEL = 'llama-3.3-70b-versatile';  // fastest, most accurate math

  // DOM elements
  const apiInput = document.getElementById('apiKeyInput');
  const saveBtn = document.getElementById('saveKeyBtn');
  const clearBtn = document.getElementById('clearKeyBtn');
  const keyStatus = document.getElementById('keyStatus');
  const problemTextarea = document.getElementById('mathProblem');
  const solveBtn = document.getElementById('solveBtn');
  const loader = document.getElementById('loader');
  const errorBox = document.getElementById('errorBox');
  const resultCard = document.getElementById('resultCard');
  const solutionStepsDiv = document.getElementById('solutionSteps');
  const answerBlock = document.getElementById('answerBlock');
  const finalAnswerSpan = document.getElementById('finalAnswerSpan');
  const copyBtn = document.getElementById('copySolutionBtn');

  // Helper: escape HTML
  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, c => c);
  }

  // format special markers: **bold** and `code`
  function formatText(text) {
    let t = escapeHtml(text);
    t = t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/`(.*?)`/g, '<code style="background:#1e1e2a;padding:2px 6px;border-radius:8px;">$1</code>');
    return t;
  }

  // ----- API Key management -----
  function updateKeyUI() {
    if (apiKey && apiKey.startsWith('gsk_')) {
      apiInput.value = '••••••••••••••••';
      apiInput.disabled = true;
      keyStatus.innerHTML = '✅ ready';
      clearBtn.style.display = 'inline-block';
    } else {
      apiInput.value = '';
      apiInput.disabled = false;
      keyStatus.innerHTML = '';
      clearBtn.style.display = 'inline-block';
    }
  }
  function loadKey() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved && saved.startsWith('gsk_')) {
        apiKey = saved;
        updateKeyUI();
      } else {
        apiKey = '';
        updateKeyUI();
      }
    } catch(e) { apiKey = ''; updateKeyUI(); }
  }
  function saveApiKey() {
    let val = apiInput.value.trim();
    if (apiInput.disabled) {
      keyStatus.innerHTML = '❌ already saved, press Clear first';
      return;
    }
    if (!val) { keyStatus.innerHTML = '❌ paste Groq key'; return; }
    if (!val.startsWith('gsk_')) { keyStatus.innerHTML = '❌ key must start with gsk_'; return; }
    try { localStorage.setItem(STORAGE_KEY, val); } catch(e) {}
    apiKey = val;
    updateKeyUI();
    keyStatus.innerHTML = '✓ saved';
  }
  function clearApiKey() {
    try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
    apiKey = '';
    updateKeyUI();
    apiInput.disabled = false;
    apiInput.value = '';
    apiInput.focus();
    keyStatus.innerHTML = 'cleared';
  }

  // ----- Groq API call (text only) -----
  async function callGroq(prompt) {
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        model: TEXT_MODEL,
        messages: [{ role: "user", content: prompt }],
        temperature: 0.1,
        max_tokens: 2000
      })
    });
    if (!response.ok) {
      const errText = await response.text();
      throw new Error(errText.substring(0, 200));
    }
    const data = await response.json();
    return data.choices[0].message.content;
  }

  // Build prompt to enforce step-by-step + final answer
  function buildPrompt(question) {
    return `You are an expert math tutor. Solve the following math problem completely, step by step. 
Return ONLY valid JSON in this exact format:
{
  "steps": [
    { "step_number": 1, "description": "First step explanation" },
    { "step_number": 2, "description": "Second step" }
  ],
  "final_answer": "the final simplified answer"
}
The problem: "${question}"
Make sure every logical step is shown. Use **bold** for key results and \`backticks\` for expressions. The final answer must be clear and exact.`;
  }

  async function solveProblem(question) {
    const prompt = buildPrompt(question);
    const raw = await callGroq(prompt);
    // extract JSON
    let jsonStr = raw.replace(/```json/gi, '').replace(/```/g, '').trim();
    const match = jsonStr.match(/\{[\s\S]*\}/);
    if (match) jsonStr = match[0];
    return JSON.parse(jsonStr);
  }

  // Render solution steps + final answer
  function renderSolution(data) {
    let stepsHtml = '';
    if (data.steps && Array.isArray(data.steps) && data.steps.length) {
      for (let step of data.steps) {
        const num = step.step_number || (data.steps.indexOf(step)+1);
        const desc = step.description || step.text || '';
        stepsHtml += `<div class="step"><strong>${num}.</strong> ${formatText(desc)}</div>`;
      }
    } else {
      stepsHtml = '<div class="step">✓ Solution received (no detailed steps)</div>';
    }
    solutionStepsDiv.innerHTML = stepsHtml;
    if (data.final_answer) {
      finalAnswerSpan.innerHTML = formatText(data.final_answer);
      answerBlock.style.display = 'block';
    } else {
      answerBlock.style.display = 'none';
    }
    resultCard.style.display = 'block';
  }

  async function handleSolve() {
    if (!apiKey) {
      errorBox.innerText = '❌ Please set your Groq API key (free from console.groq.com/keys)';
      errorBox.style.display = 'block';
      return;
    }
    const problem = problemTextarea.value.trim();
    if (!problem) {
      errorBox.innerText = '⚠️ Please type a math problem.';
      errorBox.style.display = 'block';
      return;
    }
    errorBox.style.display = 'none';
    resultCard.style.display = 'none';
    loader.style.display = 'block';
    isSolving = true;
    try {
      const result = await solveProblem(problem);
      renderSolution(result);
    } catch (err) {
      let msg = err.message;
      if (msg.includes('decommissioned') || msg.includes('model')) msg = 'Model temporarily unavailable. Please retry in a few seconds.';
      errorBox.innerText = `⚠️ ${msg}`;
      errorBox.style.display = 'block';
    } finally {
      loader.style.display = 'none';
      isSolving = false;
    }
  }

  // Copy full solution (steps + final answer)
  function copyFullSolution() {
    let stepsText = '';
    const stepDivs = document.querySelectorAll('#solutionSteps .step');
    stepDivs.forEach(div => { stepsText += div.innerText + '\n'; });
    let finalText = '';
    const finalSpan = document.getElementById('finalAnswerSpan');
    if (finalSpan && finalSpan.innerText) finalText = 'Final Answer: ' + finalSpan.innerText;
    const full = stepsText + '\n' + finalText;
    navigator.clipboard.writeText(full.trim()).then(() => {
      const original = copyBtn.innerText;
      copyBtn.innerText = '✓ Copied!';
      setTimeout(() => { copyBtn.innerText = original; }, 2000);
    }).catch(() => alert('Could not copy'));
  }

  // ----- Load examples -----
  const examples = [
    "8 ÷ 2(2+2)", "2x + 5 = 13", "∫ x² dx", "Derivative of 3x³−2x²+7",
    "Area of circle radius 7", "x²−9=0", "Pythagorean theorem a=3,b=4",
    "Factor x²+5x+6", "Solve 2x²+5x−3=0", "∫ sin(x) cos(x) dx"
  ];
  const chipContainer = document.getElementById('exampleList');
  examples.forEach(ex => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.innerText = ex;
    chip.addEventListener('click', () => {
      problemTextarea.value = ex;
      handleSolve();
    });
    chipContainer.appendChild(chip);
  });

  // Event listeners
  saveBtn.addEventListener('click', saveApiKey);
  clearBtn.addEventListener('click', clearApiKey);
  solveBtn.addEventListener('click', handleSolve);
  copyBtn.addEventListener('click', copyFullSolution);
  problemTextarea.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') handleSolve();
  });

  loadKey();
</script>
</body>
</html>
